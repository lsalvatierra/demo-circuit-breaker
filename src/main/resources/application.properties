spring.application.name=demo-circuit-breaker
# --- CONFIGURACIÓN DE RESILIENCE4J ---
# Instancia que llamaremos "bookService" en la anotación Java

# 1. Evalúa las últimas 4 peticiones
resilience4j.circuitbreaker.instances.bookService.sliding-window-size=4

# 2. Mínimo de peticiones antes de calcular el porcentaje de fallo
resilience4j.circuitbreaker.instances.bookService.minimum-number-of-calls=2

# 3. Si el 50% de las peticiones fallan, el circuito se ABRE
resilience4j.circuitbreaker.instances.bookService.failure-rate-threshold=50

# 4. Tiempo que espera en estado ABIERTO antes de intentar de nuevo
resilience4j.circuitbreaker.instances.bookService.wait-duration-in-open-state=15s

# 5. Peticiones permitidas en estado Semi-Abierto para comprobar si ya funciona
resilience4j.circuitbreaker.instances.bookService.permitted-number-of-calls-in-half-open-state=2
